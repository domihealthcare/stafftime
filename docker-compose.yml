services:
  postgres:
    image: postgres:16-alpine
    container_name: stafftime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stafftime
      POSTGRES_PASSWORD: stafftime
      POSTGRES_DB: stafftime
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stafftime -d stafftime']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
