<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3a6888" />
    <!--
      The front-desk time clock's own page (served at /kiosk), so that adding it
      to a tablet's home screen makes a "Time Clock" app that opens on the time
      clock, full screen. index.html, which staff phones install, is unchanged.
      See docs/architecture.md, "The time clock on a tablet's home screen".
    -->
    <link rel="manifest" href="/kiosk.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Time Clock" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Time Clock · Domi Staff</title>
  </head>
  <body class="bg-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
