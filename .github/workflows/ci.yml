name: CI

# Every push, every branch. A regression that only shows up when somebody
# remembers to run the tests is a regression that ships.
#
# Push only, not pull_request as well: a pull request shows the checks of the
# commit at its head, which the push already ran, so listening to both ran
# everything twice for each change (October 2026).
on:
  push:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The Prisma client is generated code. Nothing type-checks without it.
      - run: npm run prisma:generate --workspace @stafftime/api

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    name: Browser checks, part ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    # These need a real database, a real API and a real browser, so they are
    # slower and kept in their own job rather than blocking the fast feedback.
    #
    # One after another they took over 20 minutes, so they are split across
    # four machines at once, each with its own database (run-all.sh takes
    # every fourth suite). All four run to the end even when one fails, so a
    # failure in one part never hides another.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: '4'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stafftime?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stafftime?schema=public
      APP_ENVIRONMENT: test
      NODE_ENV: development
      # The suites punch in and out within seconds; see KIOSK_REPEAT_SECONDS.
      KIOSK_REPEAT_SECONDS: '0'
      # The punch reminders route refuses everything without its secret;
      # punch-reminders.mjs calls it the way the outside timer does.
      PUNCH_REMINDER_SECRET: ci-punch-reminder-secret
      # run-all.sh resets the database between suites.
      PGHOST_LOCAL: 127.0.0.1
      PGPORT_LOCAL: '5432'
      PGUSER_LOCAL: postgres
      PGDATABASE_LOCAL: stafftime
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate --workspace @stafftime/api

      # Postgres is already installed on GitHub's Ubuntu runners, so the job
      # starts that one instead of downloading an image: both Docker Hub and
      # Amazon's mirror kept refusing the download (October 2026).
      - name: Start the runner's own Postgres
        run: |
          sudo systemctl start postgresql
          for i in $(seq 1 20); do pg_isready -h 127.0.0.1 -p 5432 && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb stafftime

      - name: Create the schema
        run: npm run prisma:deploy --workspace @stafftime/api

      - name: Install Playwright and a browser
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build both apps
        run: npm run build

      - name: Start the API
        run: |
          mkdir -p tests/browser/logs
          node apps/api/dist/main.js > tests/browser/logs/api.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "API up"; exit 0
            fi
            sleep 1
          done
          echo "The API never came up:"; cat tests/browser/logs/api.log; exit 1

      # The checks run against the built bundle with the deployed security
      # headers applied — vite.config.ts reads them out of vercel.json — so a
      # Content-Security-Policy that breaks the app fails here rather than on
      # the practice's phones.
      - name: Start the web app as it is deployed
        working-directory: apps/web
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > ../../tests/browser/logs/web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              echo "Web up"; exit 0
            fi
            sleep 1
          done
          echo "The web app never came up:"; cat ../../tests/browser/logs/web.log; exit 1

      - name: Run the browser checks
        env:
          BASE_URL: http://127.0.0.1:4173
          # With no email provider configured, reset links are written to the
          # server log. The reset suite reads them from there, which is the same
          # path a developer uses locally.
          #
          # Absolute, because run-all.sh runs each suite from tests/browser —
          # a relative path would resolve against that.
          API_LOG: ${{ github.workspace }}/tests/browser/logs/api.log
        run: bash tests/browser/run-all.sh

      # Screenshots and the per-suite logs are the only way to see what a
      # failure actually looked like once the runner is gone. The server logs
      # are written in there too, rather than /tmp, because upload-artifact
      # only collects paths inside the workspace.
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ matrix.shard }}
          path: |
            tests/browser/shots/
            tests/browser/logs/
          retention-days: 7
          if-no-files-found: ignore

  # One check named "Browser checks", as before the split, so anything that
  # waits on that name still does: green only when every part passed.
  browser-result:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: browser
    if: always()
    steps:
      - name: Every part passed
        run: |
          if [ "${{ needs.browser.result }}" != "success" ]; then
            echo "A part of the browser checks did not pass: ${{ needs.browser.result }}"
            exit 1
          fi
